name: CI

on:
  push:
  pull_request:

jobs:
  api-tests-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-test .

      - name: Run API tests in container
        run: docker run --rm api-test
